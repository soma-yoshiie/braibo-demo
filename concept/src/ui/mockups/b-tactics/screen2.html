<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>BRAIBO B screen2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@500;600&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--glass:rgba(14,17,19,.78);--hair:rgba(255,255,255,.09);--sub:#9aa4ad;--blue:#2f7bff;--red:#ff4b4b;--yel:#ffd60a;--grn:#34c759}
*{box-sizing:border-box}
html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#0e1113;font-family:'Noto Sans JP','Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
svg{overflow:hidden}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.abs{position:absolute}
.status{position:absolute;left:0;top:0;width:390px;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;font-family:'Inter';font-weight:600;font-size:15px;z-index:20}
.status svg{display:block}
.home{position:absolute;left:135px;bottom:7px;width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.55);z-index:30}

.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--hair);box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.04)}
.head{left:0;top:52px;width:390px;overflow:hidden;text-align:center;z-index:10}
.head .k{font-family:'Barlow Condensed';font-weight:700;font-size:64px;line-height:.9;letter-spacing:.14em;margin-right:-.14em;text-shadow:0 4px 24px rgba(0,0,0,.6);background:linear-gradient(180deg,#fff 30%,#c9d2d9);-webkit-background-clip:text;color:transparent}
.head .j{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;font-size:14px;font-weight:700;letter-spacing:.4em;margin-right:-.4em;color:#e9eef2}
.head .j i{display:block;width:34px;height:1.5px;background:linear-gradient(90deg,transparent,var(--yel))}
.head .j i:last-child{transform:scaleX(-1)}
.plate{top:352px;width:178px;height:74px;z-index:10;display:flex;align-items:center;padding:0 12px;gap:6px;border-radius:14px}
.plate.l{left:12px;border-left:4px solid var(--blue);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);border-radius:14px 0 0 14px;background:linear-gradient(90deg,rgba(47,123,255,.3),rgba(14,17,19,.82) 70%)}
.plate.r{right:12px;border-right:4px solid var(--red);flex-direction:row-reverse;text-align:right;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%);border-radius:0 14px 14px 0;background:linear-gradient(270deg,rgba(255,75,75,.28),rgba(14,17,19,.82) 70%)}
.plate .n{font-size:42px;line-height:1;width:40px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.plate.r .n{color:#fff}
.plate .r1{font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap}
.plate .r2{margin-top:3px;font-size:10px;color:var(--sub);letter-spacing:.06em;font-family:'Inter';font-weight:500}
.vs{left:171px;top:372px;width:48px;height:32px;z-index:12;display:grid;place-items:center;font-size:17px;letter-spacing:.12em;color:#fff}
.vs:before{content:"";position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;background:#0e1113;border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.vs span{position:relative;font-size:13px;letter-spacing:.06em;margin-right:-.06em}
.cmp{left:12px;top:440px;width:366px;height:150px;border-radius:20px;z-index:10;padding:10px 16px}
.row{height:64px;position:relative}
.row+.row{border-top:1px solid rgba(255,255,255,.07)}
.row .lb{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.14em}
.row .v{position:absolute;top:2px;font-size:34px;line-height:1.1}
.row .v.a{left:0;color:#7fb0ff}.row .v.b{right:0;color:#ff8a86}
.row .v small{font-size:20px;margin-left:1px}
.row .v.dim{opacity:.55}
.trk{position:absolute;bottom:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.08)}
.trk.a{left:0;width:164px}.trk.b{right:0;width:164px}
.trk i{position:absolute;top:0;bottom:0;border-radius:3px}
.trk.a i{right:0;background:linear-gradient(270deg,#8db6ff,#2f7bff)}
.trk.b i{left:0;background:linear-gradient(90deg,#ff8a80,#ff4b4b)}
.h2h{position:absolute;left:0;right:0;bottom:9px;height:9px;display:flex;gap:3px}
.h2h i{display:block;height:100%}
.h2h .a{width:38%;background:linear-gradient(90deg,#2f7bff,#6fa4ff);border-radius:5px 2px 2px 5px;transform:skewX(-20deg)}
.h2h .b{flex:1;background:linear-gradient(90deg,#ff7a76,#ff4b4b);border-radius:2px 5px 5px 2px;transform:skewX(-20deg);opacity:.9}
.res{left:12px;top:604px;width:366px;height:132px;border-radius:22px;z-index:10;padding:16px 18px;overflow:hidden;border:1px solid rgba(111,164,255,.4);background:linear-gradient(180deg,rgba(47,123,255,.22),rgba(14,17,19,.85) 70%);box-shadow:0 14px 40px rgba(47,123,255,.2),0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.res .t{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-weight:700;font-size:19px;letter-spacing:.1em}
.res .t b{color:var(--yel);font-weight:700}
.res .t .ok{width:20px;height:20px;border-radius:50%;background:var(--grn);display:grid;place-items:center}
.res h3{margin:10px 0 0;font-size:30px;font-weight:700;letter-spacing:.06em;line-height:1.15;text-shadow:0 2px 14px rgba(47,123,255,.5)}
.res .tags2{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11.5px;color:#b8c2ca;font-weight:500}.res .tags{position:static;height:24px;padding:0 10px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--yel);background:rgba(255,214,10,.1);border:1px solid rgba(255,214,10,.4);letter-spacing:.06em}
.res p{margin:6px 0 0;font-size:11.5px;color:#b8c2ca;font-weight:500;line-height:1.5}
.cta{left:0;top:766px;width:390px;text-align:center;font-size:12px;color:var(--sub);font-weight:500;letter-spacing:.12em;z-index:10}
