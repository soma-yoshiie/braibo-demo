<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>BRAIBO B screen1</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@500;600&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--glass:rgba(14,17,19,.78);--hair:rgba(255,255,255,.09);--sub:#9aa4ad;--blue:#2f7bff;--red:#ff4b4b;--yel:#ffd60a;--grn:#34c759}
*{box-sizing:border-box}
html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#0e1113;font-family:'Noto Sans JP','Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
svg{overflow:hidden}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.abs{position:absolute}
.status{position:absolute;left:0;top:0;width:390px;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;font-family:'Inter';font-weight:600;font-size:15px;z-index:20}
.status svg{display:block}
.home{position:absolute;left:135px;bottom:7px;width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.55);z-index:30}

.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--hair);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.04)}
.menu{left:16px;top:50px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;z-index:10}
.bug{left:62px;top:50px;width:206px;height:38px;border-radius:12px;z-index:10;display:flex;align-items:center;justify-content:center;gap:0;overflow:hidden}
.bug .tm{flex:1;justify-content:flex-start;display:flex;align-items:center;gap:7px;height:100%;font-weight:700;font-size:12.5px;letter-spacing:.04em}
.bug .tm.r{flex-direction:row-reverse;justify-content:flex-start}
.chip{width:4px;height:20px;border-radius:2px}
.sc{width:62px;justify-content:center;display:flex;align-items:baseline;gap:5px;font-size:25px;line-height:1;padding:0 4px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.sc em{font-style:normal;color:var(--sub);font-size:17px;font-weight:600}
.tim{left:278px;top:50px;width:96px;height:38px;border-radius:12px;z-index:10;padding:5px 11px 0;overflow:hidden}
.tim .t{display:flex;justify-content:space-between;align-items:baseline;line-height:1;margin-top:1px}
.tim .n{font-size:20px;letter-spacing:.02em}
.tim .tt{font-size:11.5px;color:var(--sub);letter-spacing:.06em;font-family:'Barlow Condensed';font-weight:600}
.tim .pb{position:absolute;left:10px;right:10px;bottom:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.tim .pb i{display:block;height:100%;width:70%;border-radius:2px;background:linear-gradient(90deg,#ffd60a,#ffe66b)}
.sheet{left:10px;top:558px;width:370px;height:278px;border-radius:26px;padding:14px 14px 0;z-index:10}
.grab{position:absolute;left:165px;top:7px;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.hd{display:flex;align-items:center;gap:11px;margin-top:2px}
.av{width:46px;height:46px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 22%,#8db6ff,#2f7bff 50%,#1b4fc4);border:1.8px solid rgba(255,255,255,.9);display:grid;place-items:center;font-size:25px;box-shadow:0 5px 10px rgba(0,0,0,.45);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.av b{position:absolute;right:-5px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--yel);}
.nm{flex:1;min-width:0}
.nm h2{margin:0;font-size:18px;line-height:1.15;font-weight:700;letter-spacing:.02em;display:flex;align-items:baseline;gap:6px}
.nm h2 .bc{color:var(--yel);font-size:19px}
.rp{display:inline-block;height:15px;line-height:15px;padding:0 6px;margin-right:6px;border-radius:7.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#e9eef2;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.06em}
.nm p{margin:4px 0 0;font-size:11px;color:var(--sub);font-weight:500;letter-spacing:.06em;display:flex;align-items:center}
.tag{height:26px;padding:0 10px 0 8px;border-radius:13px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--yel);background:rgba(255,214,10,.1);border:1px solid rgba(255,214,10,.38);white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px;margin-top:13px}
.sr{display:flex;justify-content:space-between;align-items:baseline}
.sl{font-size:11px;color:var(--sub);font-weight:500}
.sv{font-size:17px;line-height:1}
.sv.hi{color:var(--yel)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#4d8dff,#8db6ff)}
.bar i.hi{background:linear-gradient(90deg,#ffc400,#ffe45c)}
.seg{display:flex;margin-top:13px;height:48px;padding:3px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06)}
.sg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:12px;color:#9aa4ad;font-size:10px;font-weight:700}
.sg.on{background:rgba(255,214,10,.14);color:var(--yel);box-shadow:inset 0 0 0 1px rgba(255,214,10,.45)}
.go{margin-top:11px;height:54px;border-radius:17px;background:linear-gradient(180deg,#ffe23d,#ffd60a 55%,#f2c200);color:#14120a;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 22px;box-shadow:0 8px 20px rgba(255,214,10,.22),inset 0 1px 0 rgba(255,255,255,.55)}
.go b{font-size:19px;letter-spacing:.08em}
.go .cnt{display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:12px;background:rgba(20,18,10,.88);color:#fff;font-size:11px;font-weight:700}
.go .cnt .bc{font-size:16px;color:var(--yel)}
.dots{display:flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25)}.dots i.on{background:var(--grn)}
</style></head><body>
