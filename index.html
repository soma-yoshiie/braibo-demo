<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1220" />
    <title>BRAIBO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Oswald:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <style>
      html, body { margin: 0; background: #0b1220; color: #e6edf7; }
      #boot-error {
        display: none; position: fixed; inset: 0; padding: 24px 16px; box-sizing: border-box;
        font: 15px/1.5 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #0b1220; color: #e6edf7; z-index: 9999; overflow: auto;
      }
      #boot-error h1 { font-size: 18px; margin: 0 0 8px; }
      #boot-error pre { white-space: pre-wrap; word-break: break-all; background: #141d33; padding: 12px; border-radius: 8px; font-size: 12px; }
      #boot-error button { font: inherit; padding: 12px 20px; border-radius: 10px; border: 0; background: #3b82f6; color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error">
      <h1>BRAIBO の起動に失敗しました</h1>
      <p>以下のエラー内容を確認し、再試行してください。</p>
      <pre id="boot-error-msg"></pre>
      <p><a id="boot-docs-link" href="./docs/" style="color:#7db4ff">▶ ビルド済みのゲームを開く（./docs/）</a></p>
      <button onclick="location.reload()">再試行</button>
    </div>
    <script>
      // Boot-time safety net: if the module fails to load/execute before React
      // mounts, show the error instead of a blank screen.
      (function () {
        var shown = false;
        function show(msg) {
          if (shown) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0 && !window.__BRAIBO_FORCE_BOOT_ERROR__) return;
          shown = true;
          document.getElementById('boot-error-msg').textContent = msg;
          document.getElementById('boot-error').style.display = 'block';
        }
        window.addEventListener('error', function (e) {
          show((e && e.message) || String(e));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show((e && e.reason && (e.reason.stack || e.reason.message)) || String(e.reason));
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          var msg =
            'アプリが時間内に描画されませんでした。\n' +
            'このページが開発用の index.html（Vite エントリ）として静的に配信されている場合は動作しません。\n' +
            '公開版（ビルド済み）は ./docs/ 、または npm run dev で開発サーバーを起動してください。';
          // Served statically from the repository root (e.g. GitHub Pages "main / root")?
          // If the built game exists at ./docs/, go there automatically.
          var isBuilt = !!document.querySelector('script[type="module"]:not([src])') || /\/docs\/?(index\.html)?$/.test(location.pathname);
          if (!isBuilt && location.protocol !== 'file:' && typeof fetch === 'function') {
            fetch('./docs/index.html', { method: 'HEAD' })
              .then(function (r) {
                if (r.ok) location.replace('./docs/');
                else show(msg);
              })
              .catch(function () { show(msg); });
          } else {
            show(msg);
          }
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
